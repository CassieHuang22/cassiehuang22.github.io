        highlights:
          - Lead two complete research projects involving collaboration of students and faculty members across different institutions, resulting in publications in top NLP conferences.
          - Leverage code-generation ability of open-sourced and closed-sourced LLMs to auto-formalize complex problems, leading to more robust and trustworthy performance than LLM agents.
          - Conduct the first in-depth evaluation of LLM-as-formalizer in realistic planning tasks. Created planning datasets that contain different levels of language naturalness and real-world constraints to make planning problems more realistic. Ongoing work includes extensions to POMDPSs and biosynthesis.

      - company: University of Pennsylvania
        position: Student Researcher
        location: Philadelphia, PA
        start_date: 2023
        end_date: 2024
        highlights:
          - Collaborate with students and professors across multiple institutions to extract interpretable, lexical and stylistic features used for authorship attribution.
          - Fine-tune BERT Sentence Transformer models to create embeddings representations of text. Embeddings are then used to extract features.

      - company: Boston University
        position: Student Researcher
        location: Boston, MA
        start_date: 2019
        end_date: 2019
        highlights:
          - Use videos from object tracking datasets to verify and quantify ambiguity of natural language annotations for targeted objects, and obtain new NL annotations and improve image tracking performance.
          - Designed Amazon Mechanical Turk (MTurk) Experiments given to workers, using HTML, to gather information regarding descriptions for targeted objects.

